<a class="skip-link" href="#main">Skip to content</a>
<header class="app-bar">
  <svg class="logo" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
    <circle cx="12" cy="12" r="3" fill="currentColor" />
    <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" />
  </svg>
  <h1>U1 Spool Tags</h1>
</header>

<main id="main" tabindex="-1">
  <div class="content">
    <router-outlet />
  </div>
</main>

<nav class="tab-bar" aria-label="Main">
  @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="tab.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: tab.exact }"
    >
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path [attr.d]="tab.icon" fill="currentColor" /></svg>
      <span>{{ tab.label }}</span>
    </a>
  }
</nav>
